# Publish workflow for the *public* GitHub mirror (ohallord/heimdall) after a
# private Origin snapshot is pushed there, OR for runners that execute GHA.
#
# Honest limitation: Cursor Origin (thedanoh/heimdall, forge of record) does NOT
# run GitHub Actions workflows. On Origin, run:
#   ./scripts/publish.sh --dry-run
# manually (or via a future Origin check). Leave PUBLIC_REPO_TOKEN unconfigured
# until Dan explicitly approves adding it.
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least privilege. The armed push uses PUBLIC_REPO_TOKEN (another repo), never GITHUB_TOKEN writes.
permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/hub/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/agent/go.sum
      - name: Publish dry-run (never pushes)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: ./scripts/publish.sh --dry-run

  push:
    # Fail-closed: still requires PUBLISH_ALLOW_PUSH=1 and PUBLIC_REPO_TOKEN.
    # Token is intentionally NOT configured in this private Origin repo.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [dry-run]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse unless explicitly armed
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLISH_ALLOW_PUSH: ${{ vars.PUBLISH_ALLOW_PUSH }}
          CI: "true"
          GITHUB_REF: ${{ github.ref }}
        run: |
          # scripts/publish.sh --push refuses when token/allow unset — that is success for now.
          set +e
          ./scripts/publish.sh --push --skip-tests
          ec=$?
          set -e
          if [[ -z "${PUBLIC_REPO_TOKEN:-}" || "${PUBLISH_ALLOW_PUSH:-}" != "1" ]]; then
            echo "Token/allow unset — push correctly refused (exit=$ec)"
            [[ "$ec" -ne 0 ]]
          else
            echo "Armed publish finished (exit=$ec)"
            exit "$ec"
          fi
