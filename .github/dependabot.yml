version: 2
updates:
  # SHA-pinned workflow actions (keeps the "# vX.Y.Z" comment in sync).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/hub
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: /apps/agent
    schedule:
      interval: weekly
    groups:
      k8s:
        patterns: ["k8s.io/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
