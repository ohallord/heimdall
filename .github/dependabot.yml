version: 2
updates:
  # SHA-pinned workflow actions (keeps the "# vX.Y.Z" comment in sync).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/hub
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint supports TypeScript <6.1 only. Lift once it accepts 7.
      - dependency-name: typescript
        versions: [">=7"]
      # Types track the runtime (node:26 images, Node 26 in CI). Bump both together.
      - dependency-name: "@types/node"
        versions: [">=27"]

  - package-ecosystem: gomod
    directory: /apps/agent
    schedule:
      interval: weekly
    groups:
      k8s:
        patterns: ["k8s.io/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
