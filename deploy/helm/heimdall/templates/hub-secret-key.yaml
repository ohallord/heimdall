{{- $existing := dig "secretKey" "existingSecret" "" .Values.hub -}}
{{- $plain := dig "env" "HEIMDALL_SECRET_KEY" "" .Values.hub -}}
{{- if and (not $existing) (not $plain) }}
# Chart-managed encryption key for secrets at rest. Generated on first install and reused on
# every upgrade via `lookup`; kept on `helm uninstall`. BACK THIS UP: without it, stored
# secrets (TOTP, OIDC client secret, alert/SCM tokens) cannot be decrypted.
#   kubectl -n {{ .Release.Namespace }} get secret {{ include "heimdall.name" . }}-hub-secret-key -o jsonpath='{.data.key}' | base64 -d
# NOTE: `helm template` (GitOps renderers without cluster access) cannot look this up and would
# generate a different key each render. In that case set hub.secretKey.existingSecret instead.
{{- $name := printf "%s-hub-secret-key" (include "heimdall.name" .) }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $found $found.data (hasKey $found.data "key") }}
data:
  key: {{ index $found.data "key" }}
{{- else }}
stringData:
  key: {{ randBytes 32 | quote }}
{{- end }}
{{- end }}
