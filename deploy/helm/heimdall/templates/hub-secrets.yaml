{{- /*
Chart-managed secrets, generated once and reused on every upgrade via `lookup`; kept on uninstall.
  session-secret     HEIMDALL_SESSION_SECRET, unless hub.sessionSecret.existingSecret is set.
  postgres-password  bundled Postgres password, unless postgres.auth.existingSecret is set.
Precedence per key: explicit value (hub.env.HEIMDALL_SESSION_SECRET / postgres.auth.password)
-> value already stored in this Secret -> (Postgres only) legacy "heimdall" when the namespace
already has the Postgres Deployment or data PVC (that volume was initialised with the old default;
changing POSTGRES_PASSWORD never changes an initialised DB, see docs/runbooks/postgres-password.md)
-> random. `helm template` has no cluster to look up and renders fresh random values each time:
GitOps renderers should use the existingSecret options instead.
*/ -}}
{{- $name := include "heimdall.secretsName" . -}}
{{- $session := not (dig "sessionSecret" "existingSecret" "" .Values.hub) -}}
{{- $pg := and .Values.postgres.enabled (not (dig "auth" "existingSecret" "" .Values.postgres)) -}}
{{- if or $session $pg }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $found $found.data }}{{ $data = $found.data }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $session }}
  {{- $plain := include "heimdall.sessionSecret.plain" . }}
  {{- if $plain }}
  session-secret: {{ $plain | b64enc | quote }}
  {{- else if hasKey $data "session-secret" }}
  session-secret: {{ index $data "session-secret" | quote }}
  {{- else }}
  session-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $pg }}
  {{- $pw := dig "auth" "password" "" .Values.postgres | toString }}
  {{- $pgName := printf "%s-postgres" (include "heimdall.name" .) }}
  {{- $legacy := or (lookup "apps/v1" "Deployment" .Release.Namespace $pgName) (lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-data" $pgName)) }}
  {{- if $pw }}
  postgres-password: {{ $pw | b64enc | quote }}
  {{- else if hasKey $data "postgres-password" }}
  postgres-password: {{ index $data "postgres-password" | quote }}
  {{- else if $legacy }}
  # Existing install: its data volume was initialised with the old chart default.
  postgres-password: {{ "heimdall" | b64enc | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
