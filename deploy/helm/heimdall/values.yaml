image:
  hub: heimdall/hub:0.0.1
  agent: heimdall/agent:0.0.1
  pullPolicy: IfNotPresent

hub:
  replicaCount: 1
  # Preferred over a plaintext token: a pre-created Secret holding the bootstrap token.
  #   kubectl -n heimdall create secret generic heimdall-bootstrap --from-literal=bootstrap-token=$(openssl rand -hex 32)
  existingSecret:
    name: ""
    key: bootstrap-token
  # Encryption key for secrets at rest (HEIMDALL_SECRET_KEY, 32 bytes hex/base64).
  # Default: the chart generates <release>-hub-secret-key once and keeps it across upgrades.
  # BACK IT UP. Or bring your own: secretKey.existingSecret, or env.HEIMDALL_SECRET_KEY.
  secretKey:
    existingSecret: ""
    key: key
  # Session cookie signing key (HEIMDALL_SESSION_SECRET). No default is shipped.
  # Default: the chart generates <release>-secrets (key session-secret) once and keeps it across upgrades.
  # Or bring your own Secret here, or set env.HEIMDALL_SESSION_SECRET (ends up in release values).
  sessionSecret:
    existingSecret: ""
    key: session-secret
  # Container securityContext overrides (merged over the restricted defaults in _helpers.tpl).
  containerSecurityContext: {}
  # Extra hub environment variables, e.g. HEIMDALL_ALLOW_PRIVATE_HOSTS, HEIMDALL_TRUST_PROXY,
  # HEIMDALL_RATE_LOGIN, HEIMDALL_LEGACY_TOKENS. See docs/deploy.md.
  extraEnv: {}
  # Read-only MCP bearer (`HEIMDALL_MCP_TOKEN`). Empty default: a chart upgrade does not
  # invent a token. Prefer mcp.existingSecret so the value is not stored in release state.
  mcp:
    existingSecret:
      name: ""
      key: mcp-token
  service:
    type: ClusterIP
    port: 43123
  env:
    # REQUIRED: set with --set-string hub.env.HEIMDALL_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)
    # or reference a Secret via hub.existingSecret below. No default is shipped.
    HEIMDALL_BOOTSTRAP_TOKEN: ""
    # Empty = chart-generated (see hub.sessionSecret). The old placeholder value is ignored.
    HEIMDALL_SESSION_SECRET: ""
    HEIMDALL_PUBLIC_URL: http://heimdall-hub:43123
    HEIMDALL_RP_ID: localhost
    HEIMDALL_ORIGIN: http://127.0.0.1:43123
    # Optional: pin bootstrap-token agent register to this org id (overrides
    # "prefer org with admins"). Leave empty to auto-select.
    HEIMDALL_ORG_ID: ""
    # Empty: localhost-only MCP, and the chart-managed Secret stores an empty mcp-token
    # (it is never generated). Set with --set-string hub.env.HEIMDALL_MCP_TOKEN=$(openssl rand -hex 32)
    # or hub.mcp.existingSecret.name.
    HEIMDALL_MCP_TOKEN: ""
    # Comma-separated Host allowlist used when the MCP token is set. Empty accepts any Host.
    # Helm --set-string splits on commas; use a values file or escape them (hub.lan\,mcp.example.com).
    HEIMDALL_MCP_ALLOWED_HOSTS: ""

agent:
  enabled: true
  hostname: helm-agent-01
  clusterId: default
  enableK8s: "true"
  rbac:
    create: true
  containerSecurityContext: {}
  # Per-agent secret persistence. Without a persistent volume every restart loses the
  # secret and the hub answers 409 hostname_in_use until the agent is re-enrolled.
  state:
    dir: /var/lib/heimdall
    runAsUser: 70   # 70 for alpine images, 999 for debian
  # Set to Unconfined if the host AppArmor denies signals between postgres processes
  # (kernel 7.0.0-42 + containerd default profile: "could not signal for checkpoint").
  appArmorProfile: ""
  persistence:
      enabled: true
      size: 16Mi
      storageClass: ""
  # Host disks for single-node / k3s labs: bind host / at /host (readOnly). The
  # agent discovers every real filesystem under /host for display; watchMounts is
  # only the must-present (expect) list that can raise mount_missing. Default: the
  # host root. Add separately mounted data disks you need alerted on (e.g.
  # /host/data). Disable on multi-tenant clusters that disallow hostPath.
  # Off by default (hostPath of /); the single-node lab overlay
  # values-host-mounts.yaml (passed by scripts/deploy-cluster.sh) turns it on.
  hostMounts:
    enabled: false
    # Joined to HEIMDALL_WATCH_MOUNTS with commas. Prefer a YAML list — Helm
    # --set/--set-string still split on commas inside a single string value.
    # Override: -f values, or --set agent.hostMounts.watchMounts[0]=/host …
    watchMounts:
      - /host
    # hostPath: host root → container /host (readOnly). Nested host mounts show
    # under /host/… via mountPropagation: HostToContainer.
    hostRoot: "/"
    mountPath: "/host"

postgres:
  enabled: true
  image: postgres:16-alpine
  persistence:
    enabled: true   # false = emptyDir (data lost on restart)
    size: 2Gi
    storageClass: ""
  auth:
    username: heimdall
    # Empty = chart-generated once into <release>-secrets (key postgres-password). An install that
    # already has the Postgres Deployment/PVC keeps the legacy "heimdall" its volume was initialised
    # with. Rotate: docs/runbooks/postgres-password.md. Must be URL-safe (used in DATABASE_URL).
    password: ""
    database: heimdall
    # Pre-created Secret holding the password (wins over password).
    existingSecret: ""
    secretKey: password

# OpenTelemetry Collector shipping node metrics (+ container logs) to the hub's /v1/metrics, /v1/logs.
# Mint the ingest token in Settings → Integrations → OTLP, then either set existingSecret or token.
otel:
  collector:
    enabled: false
    # daemonset: one per node (hostmetrics + container logs).
    # sidecar: extra container in the agent pod (hostmetrics only; no log tailing).
    mode: daemonset
    image: otel/opentelemetry-collector-contrib:0.111.0
    # Hub origin; the exporter appends /v1/metrics and /v1/logs. Empty = in-cluster hub Service.
    endpoint: ""
    # Preferred: pre-created Secret holding the hdo_… token.
    existingSecret:
      name: ""
      key: otel-token
    # Convenience: chart creates a Secret from this value (ends up in Helm release state).
    token: ""
    # Tail /var/log/pods (daemonset mode only).
    logs: true
    # Receive app OTLP traces on 4317/4318 via a node-local Service (daemonset only).
    traces: true
    # Restrict OTLP 4317/4318 ingress to in-cluster pods (see templates/otel-collector.yaml).
    networkPolicy:
      enabled: true
      # Limit to these namespaces (empty = all namespaces in the cluster).
      namespaces: []
      # Extra NetworkPolicyPeer entries, e.g. [{ipBlock: {cidr: 203.0.113.10/24}}] for hostNetwork apps.
      extraFrom: []
    containerSecurityContext: {}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  # Phase 33: eBPF auto-instrumentation (Grafana Beyla) for apps with no OTel SDK
  # (Plex, Jellyfin, Emby, Syncthing...). Needs kernel >= 5.8 with BTF and a privileged
  # hostPID DaemonSet. Requires otel.collector.enabled + traces (daemonset mode).
  beyla:
    enabled: false
    image: grafana/beyla:3.38.0
    # Namespaces whose workloads are instrumented (globs).
    namespaces: ["*"]
    # Extra namespaces to skip (k8s system namespaces and the Heimdall hub are always skipped).
    excludeNamespaces: []
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
