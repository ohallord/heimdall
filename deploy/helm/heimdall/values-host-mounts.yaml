# Optional overlay for single-node / homelab labs.
# Usage: helm upgrade --reuse-values … -f deploy/helm/heimdall/values-host-mounts.yaml
#
# Prefer this file over --set for watchMounts (Helm splits commas in --set-string).
agent:
  hostMounts:
    enabled: true
    watchMounts:
      - /host
      # /var is not a separate mount on homelab (root disk), so the agent reports it "missing".
      # Watch the real data disks instead (paths as seen under the /host mount).
      - /host/media1
      - /host/media/Movies
      - /host/mnt/Movies12tb
      - /host/mnt/TvShows12tb
    hostRoot: "/"
    mountPath: "/host"
