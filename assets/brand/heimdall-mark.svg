<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Heimdall Bifrost Beacon mark">
  <title>Heimdall Bifrost Beacon</title>
  <desc>Watchtower beacon over three Bifrost arcs (purple, teal, mustard).</desc>
  <!-- Full mark: tower + three arcs. Transparent ground. -->
  <g fill="none" fill-rule="evenodd">
    <!-- Outer purple arc -->
    <path d="M14 98 A50 50 0 0 1 114 98" stroke="#5B2C8A" stroke-width="8" stroke-linecap="butt"/>
    <!-- Middle teal arc -->
    <path d="M26 98 A38 38 0 0 1 102 98" stroke="#1AA6A0" stroke-width="7" stroke-linecap="butt"/>
    <!-- Inner mustard arc -->
    <path d="M38 98 A26 26 0 0 1 90 98" stroke="#D4A017" stroke-width="6" stroke-linecap="butt"/>
    <!-- Tower body (cream) -->
    <path fill="#F3EDE0" d="M54 28 L74 28 L74 86 L54 86 Z"/>
    <!-- Pointed roof -->
    <path fill="#F3EDE0" d="M50 28 L64 10 L78 28 Z"/>
    <!-- Beacon window (navy) -->
    <rect x="58" y="36" width="12" height="10" rx="1" fill="#0A1628"/>
    <!-- Base plinth -->
    <rect x="48" y="86" width="32" height="6" fill="#F3EDE0"/>
  </g>
</svg>
